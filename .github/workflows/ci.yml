name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run test:functions
      - run: npm run test:scripts
      - run: npm run test:mobile

  edge-functions:
    name: Deno check (edge functions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/food-lookup/deno.json supabase/functions/food-lookup/index.ts
      - run: deno check --config supabase/functions/auth-api/deno.json supabase/functions/auth-api/index.ts

  database:
    name: Database RLS tests (Postgres + pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifeos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifeos_test
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP into the service container
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update -qq && apt-get install -y -qq postgresql-17-pgtap >/dev/null"
      - run: bash scripts/test-db.sh
