<!-- Sign-in email for Life OS (magic link + 6-digit code). Used locally via supabase/config.toml;
     paste the same into the hosted project: Authentication → Emails → "Magic link" and "Confirm signup". -->
<h2>Sign in to Life OS</h2>
<p>Your code:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px">{{ .Token }}</p>
<p>Type it into Life OS, or open this link on the device you're signing in on:</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Sign in to Life OS</a></p>
<p>The code and link expire in 1 hour. If you didn't ask to sign in, you can ignore this email.</p>
